# Quality-filtering cascade for scripts/filter/cml_tts.py.
#
# CML-TTS is LibriVox audiobooks re-cut for speech synthesis and released at 24 kHz, already the
# codec's rate, so the audio is judged as recorded rather than regenerated and the full cascade of
# tools/metrics/pipeline.py applies. Values below are the calibrated defaults of
# knowledge/data_filtering.md; re-derive them per language once a --limit run shows how the
# rejection breakdown falls.

# Shared floor, checked before any metric runs. Measured from the audio, never from the corpus's
# own duration column, which is computed at 22.05 kHz and so reads 8.8% long (knowledge/cml_tts.md).
min_duration: 3.0
max_duration: 30.0

# Fraction of Nyquist still carrying speech. 0.85 is the gate that catches 16 kHz sources
# upsampled into a 24 kHz container.
bandwidth_min_frac: 0.85
bandwidth_band_hz: 1000.0        # drop to 500.0 when per-file cutoff precision matters
bandwidth_cliff_db: 20.0         # a band counts as speech-bearing only if it does not cliff
                                 # more than this against the band below it

# Fraction of samples lost to clipping, counted over runs of >= 3 rather than single samples.
clipping_max_ratio: 0.0001

# Mains hum in dB above the surrounding floor, enforced only when the line locks onto 50/60 Hz.
hum_max_prominence: 15.0
hum_freq_tolerance: 0.3

# Noise-floor spectral flatness. The lower bound catches tonal floors (hum, music bass); the
# upper bound catches broadband hiss. Both apply only when speech fails to rise
# flatness_loudness_threshold dB (A-weighted) above the floor, so inaudible floors pass.
flatness_min: 0.0005
flatness_max: 0.25
flatness_loudness_threshold: 35.0

# NISQA v2.0, 1-5 per dimension. Gate on discontinuity and coloration: they are ~3x more stable
# than MOS and noisiness, which move with content alone. These are the repo's own defaults rather
# than Emilia's stricter set, which rejected 42% of LibriTTS (knowledge/wolne_lektury.md §5).
nisqa_min:
  noisiness: 3.25
  discontinuity: 3.75
  coloration: 3.5
  loudness: 3.0
nisqa_max_duration: 50.0         # NISQA raises above ~50 s; chunk long-form audio first
nisqa_device: null               # null -> CUDA, else MPS, else CPU

# Speech from a second speaker, in seconds (pyannote segmentation 3.0).
multi_speaker_enabled: true      # false skips the stage entirely, and its model load
multi_speaker_max:
  second: 0.0                    # 2nd-most-active speaker, overlapping or not
  overlap: 0.0                   # two speakers at once
multi_speaker_device: null       # null -> CUDA, else MPS, else CPU

# CTC forced alignment against the transcript (MMS_FA). This is the stage that earns its keep
# here: CML-TTS transcripts routinely stop short of what the clip says, and the corpus's own
# levenshtein column reads 0.13 at the 5th percentile. loss+maxrate catch audio clipped
# mid-transcript; gap_speech/trail_speech catch audio saying more than the transcript does.
ctc_enabled: true
ctc_uroman_enabled: true         # non-ASCII diacritics shatter into unalignable fragments without it
ctc_max:
  loss: 1.0
  max_loss: 1.0
  maxrate: 30.0
  gap_speech: 0.06
  trail_speech: 0.05
ctc_device: null                 # null -> CUDA, else MPS, else CPU
