# The YODAS2-Sidon pipeline.

# The run's name and batches (run.name, source.language, source.batches) are not set here: scripts/run_language.py
# sets them for every chunk. For one run by hand, add them with --set (see scripts/run_pipeline.py).
run:
  data_root: data/yodas2_sidon     # raw/, clips/, batches/ and runs/<name>/ live under it

resources:
  gpus: all                        # or a list of indices, e.g. [0, 1]
  fetch_ahead: 3                   # raw batches (about 3 GB each) downloaded ahead of the GPUs
  cpu_workers: 24                  # processes that read, resample and VAD recordings ahead of Whisper, per GPU;
                                   # with 8 the GPU waits for audio (418 s per batch against 380 s)
  threads_per_worker: 4            # thread cap of every worker process

disk:                              # used only for the disk warning
  raw_gb_per_batch: 3.0
  clips_gb_per_batch: 3.5          # segmented clips of one batch, before rejected audio is discarded
  kept_share: 0.5                  # share of the segmented audio that survives the filters

# The stages, in order. Remove a name to skip that stage; source_pass and speaker_drift can also be switched off
# below. Batch stages (up to discard_rejected) run once per batch, the rest once over all batches.
pipeline: [fetch, segment, quality, source_pass, speaker_drift, discard_rejected,
           merge, transcript_fixup, speaker_fixup, select, highlights, finalize]

segment:
  whisper: large-v3-turbo          # faster-whisper model name
  workers: 3                       # Whisper loops sharing one GPU, each a process with its own model (about
                                   # 4.6 GB of GPU memory each). One loop leaves the GPU at 63%; 4 is 4% faster
                                   # than 3 but takes 18 GB, and 6 does not fit in 24 GB
  batch_size: 16                   # Whisper windows per batch
  beam_size: 5
  margin: 2.0                      # seconds read beyond the first and last caption
  target_duration: 8.0             # an utterance closes at the first clean boundary past this
  min_duration: 3.0
  max_duration: 30.0
  max_pause: 2.0                   # a longer pause inside an utterance ends it
  min_gap: 0.15                    # a cut needs at least this much silence
  lead: 0.1                        # silence kept before the speech; OmniVoice's prompt keeps 100 ms
  trail: 0.2                       # and after it; the prompt keeps 200 ms
  keep_raw: false                  # false deletes the raw batch once it is segmented

quality:
  # Shared floor, checked before any metric runs. The segmenter already cuts 3-25 s utterances.
  min_duration: 3.0
  max_duration: 30.0
  # The cascade, cheapest first; a clip stops at the first metric it fails. Remove a name to switch a metric off.
  metrics: [bandwidth, clipping, hum, flatness, multi_speaker, nisqa, ctc]
  workers: 5                       # processes per GPU, each holding every model; the GPU saturates by 6, and at
                                   # 10 a 24 GB card runs out of memory
  max_error_rate: 0.01             # the stage stops when more than this share of its clips raise an error
  # Fraction of Nyquist still carrying speech.
  bandwidth:
    min_frac: 0.85
    band_hz: 1000.0
    cliff_db: 20.0
  # Fraction of samples lost to clipping, counted over runs of >= 3 rather than single samples.
  clipping:
    max_ratio: 0.0001
  # Mains hum in dB above the surrounding floor, enforced only when the line locks onto 50/60 Hz.
  hum:
    max_prominence: 15.0
    freq_tolerance: 0.3
  # Noise-floor spectral flatness. YouTube audio carries music beds, and a tonal floor is what those look like.
  flatness:
    min: 0.0005
    max: 0.25
    loudness_threshold: 35.0
  # Speech from a second speaker, in seconds (pyannote segmentation 3.0).
  multi_speaker:
    max:
      second: 0.0                  # 2nd-most-active speaker, overlapping or not
      overlap: 0.0                 # two speakers at once
  # NISQA v2.0, 1-5 per dimension.
  nisqa:
    min:
      noisiness: 3.0
      discontinuity: 3.5
      coloration: 3.25
      loudness: 3.0
    max_duration: 50.0
  # CTC forced alignment of the clip against its Whisper transcript.
  ctc:
    uroman: true                   # non-ASCII diacritics shatter into unalignable fragments without it
    max:
      loss: 0.7
      max_loss: 1.0
      maxrate: 30.0
      gap_speech: 0.06
      trail_speech: 0.05

# A recording whose diarised clips are flagged this often is an interview or a panel, and its other clips are not
# trusted either.
source_pass:
  enabled: true
  max_flag_rate: 0.3               # share of a recording's scored clips the multi-speaker metric may reject
  min_clips: 3                     # recordings with fewer scored clips are left alone

# ECAPA similarity between 2 s windows of a clip; a clip is dropped at z <= max_z within its duration band.
speaker_drift:
  enabled: true
  max_z: -2.0
  workers: 4

# Adds the transcription_normalized column (Verbalis). 
# A clip with a number stays only if Whisper, made to spell numbers out, reads it the way Verbalis does.
transcript_fixup:
  whisper: large-v3-turbo
  beam_size: 5
  workers: 3                       # Whisper loops per GPU
  normalize: true                  # one form for quotes, apostrophes, dashes, ellipses
  trim: true                       # single spaces, none before punctuation
  terms: true                      # abbreviations and web addresses as words

speaker_fixup:
  threshold: 0.5                   # fraction of clip pairs that must agree for two videos to be one person
  linkage: single                  # average, complete, single or weighted
  clips_per_speaker: 4             # clips embedded per video; every pair of them is compared

select:
  min_per_speaker: 2               # speakers with fewer clips are left out
  max_per_speaker: 64              # a speaker with more keeps a random subset
  max_minutes_per_speaker: null    # optional cap on a speaker's audio, in minutes
  seed: 0

# A small second dataset in runs/<run>/highlights/: the most expressive, most aroused and most unusual voices.
highlights:
  per_list: 50                     # clips per list
  per_speaker: 2                   # most clips one speaker may have in a list
  workers: 1                       # scoring loops per GPU, 7 GB of GPU memory each; a second one adds no speed

finalize:
  move: true                       # move the selected clips out of clips/ instead of copying them
  zip: true                        # pack audio/ into audio.zip and remove audio/
  compression: deflate             # deflate (lossless) or stored
  codecs: []                       # e.g. [higgs] also writes codecs/higgs/<name>.npy; needs `pip install .[higgs]`

orchestrate:                       # scripts/run_language.py only; run_pipeline.py ignores it
  chunk_batches: 50                # one pipeline run per 50 batches of a shard, named <lang><shard>_<last + 1>
  shards: []                       # e.g. ["004", "005"]; empty takes every shard of the language
  poll_seconds: 60
  stall_minutes: 30                # run.log silent this long while the pipeline lives counts as a hang
  max_failures: 3                  # a batch failing this often is quarantined; a pool stage stops everything
  min_free_gb: 160                 # a chunk starts only with this much free disk
  upload:
    remote: gdrive-yodas           # rclone remote with write access to the Drive
    root_folder_id: 1C0nDclN_APyngv87XV7x7Uy49IlnUI-G
    path: train/{language_name}/yodas2_sidon/{run}
    highlights: true
    transfers: 4
    retries: 3
    stats_seconds: 30              # interval of the upload progress lines
